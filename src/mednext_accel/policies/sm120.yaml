# RTX 5090 legacy operator evidence. Reviewed depthwise work scaling remains
# unbounded above so larger same-SM devices receive useful defaults. Recipes live in
# Python; only C128/32^3 B4/B6 change launch parameters relative to the recipe.
# Pointwise work intervals retain legacy B2..6 (or narrower) endpoints.
# Only complete positive channel strips merge; isolated rows stay exact.
# No new integrated RTX 5090 grid evidence is used in this migration.
# Nine confidence-only dW overrides and one shadowed pointwise row are omitted.
version: 2
kind: mednext-accel-policy
name: sm120
target:
  vendor: nvidia
  sm: [12, 0]
scope: {dtype: bfloat16}
evidence:
- {id: legacy-rtx5090-policy, sha256: d33cf9e7ea50575de8e48d3ed8a1793054ad2459e0f5d61314660ac258746c1b}
