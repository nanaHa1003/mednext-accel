# RTX 5090 supported shapes. Structural depthwise scaling remains unbounded
# in batch so larger same-SM devices receive useful defaults. Recipes live in
# Python; only C128/32^3 B4/B6 change launch parameters relative to the recipe.
# Non-stem pointwise common shapes are bounded B2..6, other intervals retain
# their legacy bounds. VRAM-only pointwise extrapolations are deliberately removed.
# Nine confidence-only dW overrides and one shadowed pointwise row are omitted.
version: 2
kind: mednext-accel-policy
name: sm120
target:
  vendor: nvidia
  sm: [12, 0]
scope: {dtype: bfloat16}
evidence:
- {id: legacy-rtx5090-policy, sha256: d33cf9e7ea50575de8e48d3ed8a1793054ad2459e0f5d61314660ac258746c1b}
rules:
  - id: dw-split-b4-128-32
    when: {family: depthwise_conv3d, direction: regular, kernel_size: [3, 3, 3], batch: 4, spatial_shape: [32, 32, 32], channels: [128, 128]}
    use: {backward_weight: {implementation: triton_split_dw, parameters: {dw_splits: 4}}}
    confidence: measured-exact-context
  - id: dw-split-b6-128-32
